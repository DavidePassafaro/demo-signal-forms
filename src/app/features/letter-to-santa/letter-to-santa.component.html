<div class="page-container">
  <div class="page-header">
    <h2>✉️ Scrivi una Lettera a Babbo Natale</h2>
    <p>Racconta a Babbo Natale come è stato il tuo anno e cosa vorresti per Natale!</p>
  </div>

  <form class="signal-form" (submit)="onSubmit($event)">
    <div class="signal-field">
      <label for="name">Il tuo Nome e Cognome *</label>
      <input
        id="name"
        placeholder="Inserisci il tuo nome e cognome"
        type="text"
        class="signal-input"
      />
    </div>

    <div class="signal-field">
      <label for="age">La tua Età *</label>
      <input
        id="age"
        placeholder="Inserisci la tua età"
        type="number"
        class="signal-input"
      />
    </div>

    <div class="signal-field">
      <label for="country">Dove vivi *</label>
      <select id="country" class="signal-input">
        <option value="roma">Roma Roma</option>
        <option value="roma-nord">Roma Nord</option>
        <option value="fuori-roma">Fuori Roma, ma dico a tutti che vivo a Roma</option>
        <option value="resto-del-mondo">Resto del mondo</option>
      </select>
    </div>

    <div class="signal-field">
      <label for="behavior">Come è stato il tuo comportamento? *</label>
      <div class="signal-radios">
        <label class="signal-radio-item">
          <input type="radio" value="good" />
          Molto Buono! 😇
        </label>
        <label class="signal-radio-item">
          <input type="radio" value="fair" />
          Abbastanza Buono 🤔
        </label>
        <label class="signal-radio-item">
          <input type="radio" value="improving" />
          In Miglioramento 😊
        </label>
        <label class="signal-radio-item">
          <input type="radio" value="bad" />
          Da Migliorare 😬
        </label>
      </div>
    </div>

    <div class="signal-field">
      <label for="wishes">Cosa desideri per Natale? *</label>
      <textarea
        id="wishes"
        placeholder="Racconta a Babbo Natale i tuoi desideri..."
        rows="4"
        class="signal-input"
        required
      ></textarea>
    </div>

    <div class="signal-field">
      <label for="email">La tua Email *</label>
      <input
        id="email"
        placeholder="Inserisci la tua email"
        type="email"
        class="signal-input"
        required
      />
    </div>

    <div class="signal-field">
      <label for="confirmEmail">Conferma la tua Email *</label>
      <input
        id="confirmEmail"
        placeholder="Conferma la tua email"
        type="email"
        class="signal-input"
        required
      />
    </div>

    <button type="submit" class="signal-btn-submit">
      🎅🏼 Invia a Babbo Natale 🎄
    </button>
  </form>
</div>
